<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  {% if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">{% endif %}
  <link rel="icon" media="(prefers-color-scheme:light)" href="{{ '/assets/img/favicon_bright.ico' | relative_url }}" sizes="any">
  <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ '/assets/img/favicon_dark.ico' | relative_url }}" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>
<body class="pv-page">
{{ content }}
</body>
</html>
